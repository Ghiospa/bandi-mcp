[project]
name = "bandi-mcp"
version = "0.1.0"
description = "Finanza agevolata agent-first: server MCP che espone bandi e ammissibilità agli agenti AI. Catalogo iniziale: Sicilia."
requires-python = ">=3.11"
dependencies = ["mcp>=2.0", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bandi-mcp = "bandi_mcp.server:main"

# Deploy serverless: Vercel carica l'app ASGI da qui (vedi asgi.py e DEPLOY.md).
[tool.vercel]
entrypoint = "asgi:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bandi_mcp"]

[tool.setuptools.package-data]
bandi_mcp = ["../data/*.json"]
